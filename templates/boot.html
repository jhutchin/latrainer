<script src="%%LATRAINER_JS%%"></script>
<script>
/* Boot: wait for the shared runtime, then render into this card's #lat-root.
   Polling (rather than relying on script order) because whether an external
   <script src> finishes before the next inline script varies by Anki client. */
(function () {
  var host = document.getElementById("lat-root");
  if (!host) return;
  var tries = 0;
  (function boot() {
    if (!document.body.contains(host)) return; /* card was replaced; stop */
    if (window.LAT && window.LAT.mount) { window.LAT.mount(host); return; }
    if (++tries <= 100) { setTimeout(boot, 30); return; }
    var q = host.querySelector(".lat-q") || host;
    q.innerHTML = '<div class="lat-warn"><strong>Could not load %%LATRAINER_JS%%.</strong><br>' +
      'The shared script is missing from the media folder or was blocked. ' +
      'Try Tools &rarr; Check Media on desktop, then sync.</div>';
  })();
})();
</script>
