notation:
  - id: core.notation.l2-norm
    verified: false
    tags: [norms]
    front: >-
      What does \(\|\mathbf{x}\|_2\) denote, and how do you compute it?
    back: >-
      The Euclidean (L2) norm, i.e. the length of \(\mathbf{x}\):
      \[\|\mathbf{x}\|_2 = \sqrt{\textstyle\sum_i x_i^2} = \sqrt{\mathbf{x}^\top\mathbf{x}}.\]
      Example: \(\|(3, 4)\|_2 = 5\).

  - id: core.notation.hadamard-vs-kronecker
    verified: false
    tags: [products]
    front: >-
      Distinguish \(A \odot B\) from \(A \otimes B\).
    back: >-
      \(A \odot B\) is the <b>Hadamard</b> (elementwise) product. \(A\) and \(B\)
      must have the same shape, and \((A \odot B)_{ij} = a_{ij}b_{ij}\).<br><br>
      \(A \otimes B\) is the <b>Kronecker</b> product. For \(A\) of size
      \(m\times n\) and \(B\) of size \(p\times q\), it is the \(mp \times nq\)
      block matrix whose \((i,j)\) block is \(a_{ij}B\).<br><br>
      For vectors, \(\mathbf{u}\otimes\mathbf{v}\) is often used for the outer
      product \(\mathbf{u}\mathbf{v}^\top\).
